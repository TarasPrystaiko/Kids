<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оберіть відео</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #fef6ff;
      --text-color: #333;
      --card-color: #fff;
      --accent-color: #ff69b4;
    }

    body.light {
      --bg-color: #fff6e5;
      --text-color: #222;
      --card-color: #ffffff;
      --accent-color: #ffa500;
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--bg-color);
      font-family: 'Fredoka One', cursive;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background 0.4s ease, color 0.4s ease;
    }

    .logo {
      width: 120px;
      margin-bottom: 10px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    .theme-toggle {
      margin-bottom: 25px;
      cursor: pointer;
      background: var(--accent-color);
      border: none;
      color: #fff;
      padding: 8px 20px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .theme-toggle:hover {
      background: #ff1493;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 2.4rem;
      color: var(--accent-color);
    }

    .video {
      background: var(--card-color);
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      margin: 20px;
      padding: 20px 15px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      animation: fadeIn 0.8s ease forwards;
      opacity: 0;
      border: 3px dashed var(--accent-color);
    }

    .video:nth-of-type(1) { animation-delay: 0.2s; }
    .video:nth-of-type(2) { animation-delay: 0.4s; }
    .video:nth-of-type(3) { animation-delay: 0.6s; }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
      from {
        opacity: 0;
        transform: translateY(30px);
      }
    }

    .thumbnail {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: var(--accent-color);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 17px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 14px rgba(255, 105, 180, 0.5);
    }
  </style>
</head>
<body>
  <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" alt="YouTube Logo" class="logo">
  <button class="theme-toggle" onclick="document.body.classList.toggle('light')">Змінити тему</button>
  <h1>Обери відео 😄</h1>

  <div class="video">
    <img class="thumbnail" src="https://img.youtube.com/vi/u9Dg-g7t2l4/hqdefault.jpg" alt="Video thumbnail">
    <a class="btn" href="https://www.youtube.com/watch?v=u9Dg-g7t2l4" target="_blank">🎥 Дивитись!</a>
  </div>

  <div class="video">
    <img class="thumbnail" src="https://img.youtube.com/vi/pmoYP_QvGsM/hqdefault.jpg" alt="Video thumbnail">
    <a class="btn" href="https://www.youtube.com/watch?v=pmoYP_QvGsM" target="_blank">🎉 Почати пригоди!</a>
  </div>

  <div class="video">
    <img class="thumbnail" src="https://img.youtube.com/vi/iJDtukGW79Y/hqdefault.jpg" alt="Video thumbnail">
    <a class="btn" href="https://www.youtube.com/watch?v=iJDtukGW79Y" target="_blank">🎬 Дивитись ще!</a>
  </div>
</body>
</html>
